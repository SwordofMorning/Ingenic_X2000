defaults.pcm.!card CODEC_NAME
defaults.ctl.!card CODEC_NAME

pcm.!default {
    type asym
    playback.pcm {
        type plug
        slave.pcm "dmixer"
    }
    capture.pcm "voice"
}

ctl.!default {
    type hw
    card {
    @func refer
        name defaults.ctl.card
    }
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm {
            type hw
            card {
                @func refer
                name defaults.pcm.card
            }
            device 0
            subdevice 0
        }
        format FMT
        rate RATE
        period_size PERIOD_SIZE
        buffer_size BUF_SIZE
        channels CHANNELS
    }
}

pcm.voice {
    type plug
    slave.pcm {
        type hw
        card {
            @func refer
            name defaults.pcm.card
        }
        device 0
        rate RATE
        format FMT
        channels CHANNELS
    }
}