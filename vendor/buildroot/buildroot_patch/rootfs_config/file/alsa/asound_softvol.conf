defaults.pcm.!card CODEC_NAME
defaults.ctl.!card CODEC_NAME

pcm.!default {
    type plug
    slave.pcm "softvol"
}

ctl.!default {
    type hw
    card {
    @func refer
        name defaults.ctl.card
    }
}

pcm.!softvol {
    type softvol
    slave {
        pcm {
            type hw
            card {
                @func refer
                name defaults.pcm.card
            }
            device 0
            subdevice 0
        }
    }
    control.name    "softvolume"
    min_dB          MIN_dB
    max_dB          MAX_dB
    resolution      RESOLUTION
}