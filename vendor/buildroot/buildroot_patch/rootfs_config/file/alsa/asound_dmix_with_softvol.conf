defaults.pcm.!card CODEC_NAME
defaults.ctl.!card CODEC_NAME

pcm.!default {
    type plug
    slave.pcm "dmixer"
}

ctl.!default {
    type hw
    card {
    @func refer
        name defaults.ctl.card
    }
}

# 1 第一次播放的时候无法调音量,所以可以预先播一个静音数据缓解尴尬
# 2 播放形如 aplay -Dsoftvol xxx.wav
# 3 调节音量 cmd_alsa set_ctl card=default ctl=vol1 value=40
# 3 注意调音量时 card 是 default, 不是 softvol
#        min_dB          -48.0   # 0 时对应的 db
#        max_dB          0.0     # 99 时对应的 db
#        resolution      100     # 音量调节范围 [0, 99]
# 4 这个 max_dB 很坑,你的音量太小可能就是因为它太小
pcm.!softvol {
    type            plug
    slave.pcm {
        type            softvol
        slave.pcm       "default"
        control.name    "softvolume"
        min_dB          MIN_dB
        max_dB          MAX_dB
        resolution      RESOLUTION
    }
}

pcm.dmixer {
    type dmix
    ipc_key 1024
    slave {
        pcm {
            type hw
            card {
                @func refer
                name defaults.pcm.card
            }
            device 0
            subdevice 0
        }
        format FMT
        rate RATE
        period_size PERIOD_SIZE
        buffer_size BUF_SIZE
        channels CHANNELS
    }
}