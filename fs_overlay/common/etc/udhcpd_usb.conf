# udhcpd configuration for the RNDIS link (usb0), started by etc/init.d/S70USB.
#
# Why: without a DHCP server on the link, a Windows host falls back to an
# APIPA address (169.254.x.x) and cannot reach the board, so someone has to
# configure a static IP on the PC by hand. With this file the host gets an
# address on 192.168.8.0/24 as soon as the RNDIS adapter comes up.
#
# Address layout (kept in sync with RNDIS_IP in etc/init.d/S70USB):
#   board/usb0 : 192.168.8.168/24   (router + DNS for the link)
#   host pool  : 192.168.8.100-149  (deliberately excludes the board address)
#
# Busybox udhcpd wants TAB separated values.

start		192.168.8.100
end		192.168.8.149
interface	usb0

# The board is the router/DNS of the link. It does not NAT by default: add
# "iptables -t nat -A POSTROUTING -o wlan0 -j MASQUERADE" if the host should
# reach the internet through the board.
opt		router	192.168.8.168
opt		dns	192.168.8.168
option		subnet	255.255.255.0

max_leases	50
lease_file	/tmp/udhcpd_usb.leases
