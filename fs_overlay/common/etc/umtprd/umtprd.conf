# uMTP-Responder configuration - VOT X2000 board
#
# Started by /etc/init.d/S70USB (our own gadget script). The vendor's copy of
# this file (rootfs_config/file/usb_mtp/umtprd.conf) is not installed anymore
# because APP_usb_mtp_server is disabled in our product defconfig; this file is
# part of fs_overlay and overrides whatever the vendor would install.
#
# Differences from the vendor file:
#   - storage: /usr/data (the writable ubi volume mounted by S21mount_ubifs)
#     instead of /tmp/sdcard (this board has no SD data partition)
#   - our own identity strings

# Raise the storage at start and keep it on disconnect (1) so the host can
# remount without restarting the daemon.
loop_on_disconnect 1

# Exposed storage: path, display name, flags
storage "/usr/data" "user data" "rw"

# Device identity as seen by the host
manufacturer "VOT"
product "VOT X2000 Board"
serial "0123456789"
firmware_version "Rev A"
interface "MTP"

# USB identity (matches S70USB; Android-compatible MTP ids)
usb_vendor_id  0x18D1
usb_product_id 0x4EE1
usb_class 0x6
usb_subclass 0x1
usb_protocol 0x1
usb_dev_version 0x0300

# FunctionFS mode: endpoints are provided by the kernel gadget (configfs)
usb_functionfs_mode 0x1
usb_dev_path   "/dev/ffs-mtp/ep0"
usb_epin_path  "/dev/ffs-mtp/ep1"
usb_epout_path "/dev/ffs-mtp/ep2"
usb_epint_path "/dev/ffs-mtp/ep3"
usb_max_packet_size 0x200
