# udhcpd configuration for the CDC-NCM link (usbncm0), started by etc/init.d/S70USB.
#
# Why: on Windows 11 the RNDIS path is effectively closed (see docs/
# bringup_v211_fixes.md section 14.9), so NCM is the default USB network link.
# Without a DHCP server on it a Windows host falls back to an APIPA address
# (169.254.x.x) and someone has to configure a static IP by hand.
#
# Address layout (kept in sync with NCM_IP / NCM_IF in etc/init.d/S70USB):
#   board/usbncm0 : 192.168.9.168/24   (router + DNS for the link)
#   host pool  : 192.168.9.100-149  (deliberately excludes the board address)
#
# Separate subnet from the RNDIS link (192.168.8.0/24) so both links can be
# active at once without confusing the host's routing table.
#
# Busybox udhcpd wants TAB separated values.

start		192.168.9.100
end		192.168.9.149
interface	usbncm0

# The board is the router/DNS of the link. It does not NAT by default: add
# "iptables -t nat -A POSTROUTING -o wlan0 -j MASQUERADE" if the host should
# reach the internet through the board.
opt		router	192.168.9.168
opt		dns	192.168.9.168
option		subnet	255.255.255.0

max_leases	50
lease_file	/tmp/udhcpd_ncm.leases
