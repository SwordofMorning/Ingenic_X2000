# udhcpd configuration for the CDC-NCM link (usbncm0) - OPT-IN.
#
# The default for that link is a link-local static address and NO DHCP server:
# the board takes 169.254.9.168/16 (NCM_IP), so Windows/macOS assign themselves a
# 169.254.x.x address automatically and nothing has to be configured on the host.
# Enable this file only if you prefer leases:
#     UDHCPD_NCM_CONF=/etc/udhcpd_ncm.conf NCM_IP=192.168.9.168 \
#     NCM_NETMASK=255.255.255.0 /etc/init.d/S70USB restart
#
# Why the link exists at all: on Windows 11 the RNDIS path is effectively closed
# (see docs/bringup_v211_fixes.md section 14.9), so NCM is the default USB
# network link. This file is only needed when leases are preferred over the
# link-local default.
#
# Address layout (kept in sync with NCM_IP / NCM_IF in etc/init.d/S70USB):
#   board/usbncm0 : 192.168.9.168/24   (router + DNS for the link)
#   host pool  : 192.168.9.100-149  (deliberately excludes the board address)
#
# Separate subnet from the RNDIS link (192.168.8.0/24) so both links can be
# active at once without confusing the host's routing table.
#
# Busybox udhcpd wants TAB separated values.

start		192.168.9.100
end		192.168.9.149
interface	usbncm0

# The board is the router/DNS of the link. It does not NAT by default: add
# "iptables -t nat -A POSTROUTING -o wlan0 -j MASQUERADE" if the host should
# reach the internet through the board.
opt		router	192.168.9.168
opt		dns	192.168.9.168
option		subnet	255.255.255.0

max_leases	50
lease_file	/tmp/udhcpd_ncm.leases
