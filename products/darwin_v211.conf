# ---------------------------------------------------------------------------
# 产品配置: darwin_v211
#
# 目标板: Darwin_X2000_V2.1.1 (芯片 X2000H, 512MB LPDDR3, 1Gbit SPI-NAND ATO25D1GA)
# 依据  : vendor/build/configs/x2000_darwin_v20_5.10_nand_factory_defconfig
#         (原厂对该板的出厂配置; 我们的差异集中在本文件与 configs/ 目录)
#
# 说明: 本文件是"产品真源", 由 build.sh 读取 (bash source), 也是给人看的规格。
#       选择项一层: 引导 / 内核 / rootfs / 应用配置 / 介质 / 分区 / 工具链 / 覆盖层
# ---------------------------------------------------------------------------

PRODUCT_NAME="darwin_v211"

# --- 芯片与介质 -------------------------------------------------------------
CHIP="x2000h"                 # X2000H = 512MB LPDDR3 (X2000/E/H pin 兼容)
MEDIA="nand"                  # SPI-NAND; 将来换 eMMC 只改这里 + 分区定义

# --- 配置四元组 -------------------------------------------------------------
# 应用层主配置 (由 build.sh 在沙箱 build/build/ 下执行 make <APP_CONFIG>)
# 这是我们自己的产品配置: 由厂商 darwin 配置派生, 含 V2.1.1 板级修正,
# 放在 configs/build/configs/ 下 (镜像 vendor/build/ 的布局)。
APP_CONFIG="vot_x2000_ingenic_board_defconfig"
# 内核 (5.10.186) 与内核配置
KERNEL_DIR="vendor/kernel/kernel"
KERNEL_CONFIG="x2000_module_base_linux_sfc_nand_defconfig"
# u-boot (boards.cfg 中的条目)
UBOOT_CONFIG="x2000_base_xImage_sfc_nand"
# buildroot (rootfs 用户态): 我们的配置 = 厂商配置 + 可写 UBIFS rootfs + hostapd/iw
ROOTFS_CONFIG="vot_x2000_ingenic_board_defconfig"

# --- 工具链 (T3 外置包, 位于仓库 toolchains/, 不进 git) ---------------------
# darwin 出厂路线: gcc720 编 u-boot, gcc930 作为 buildroot 外部工具链编内核与 rootfs
TOOLCHAINS="mips-gcc720-glibc229 mips-gcc930-glibc228"

# --- 覆盖层与交付 -----------------------------------------------------------
FS_OVERLAY="fs_overlay/common fs_overlay/darwin_v211"
OTA="n"                       # 不使用君正内置 A/B OTA (保留 ota_updater 源码备用)
OUTPUT_NAME="darwin_v211"

# --- 出厂登录 (统一出场配置) -------------------------------------------------
# 账号固定为 root, 口令就是下面的 ROOT_PASSWORD (明文只存在于本文件, 是唯一真源)。
# build.sh 在打包 rootfs 时把它算成 crypt(3) SHA-512 哈希, 写进镜像的 /etc/shadow
# 字段 2 (镜像里只有哈希, 没有明文), 串口与 SSH 共用这一套账号:
#   OpenSSH  : 编译时带 shadow 支持 (HAVE_SHADOW_H), 走 getspnam()
#   busybox  : CONFIG_FEATURE_SHADOWPASSWDS=y, login/passwd/su 都读 shadow
# 算法是 $6$ (SHA-512): 目标端 glibc 2.28 的 libcrypt 与 busybox 内置 crypt 都支持。
# ROOT_PASSWORD_SALT 是固定盐 (字符集 [./0-9A-Za-z], 最长 16): 盐不变 + 口令不变
# => 每次构建出同样的哈希, 镜像可复现 (openssl 与 python3 算出的结果一致)。
# 注意: 出厂口令写在仓库里 = 任何拿到仓库/固件的人都知道它, 量产前请改这里,
#       或出厂后用 passwd 逐台改成不同口令。
ROOT_PASSWORD="cdjp123"
ROOT_PASSWORD_SALT="votX2000v211"

# --- 待确认项 (S5 阶段落地) -------------------------------------------------
# HIGHMEM      : 采用默认配置时需打开 CONFIG_HIGHMEM=y 才能用满 512MB DDR (原厂出厂配置已打开)
# NAND 布局     : 芯片 128MiB; u-boot 默认 mtdparts = 1M(boot),8M(kernel),40M(rootfs),-(data)
#                板级 dts 内的 fixed-partitions 写的是 256MiB 假设, 需实测确认哪一份生效
